version: "3.9"

services:
  app:
    container_name: smartdocflow-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - smartdocflow-net
    restart: unless-stopped

  postgres:
    container_name: smartdocflow-postgres
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartdocflow-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    container_name: smartdocflow-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_NAME}
      MINIO_ROOT_PASSWORD: ${MINIO_ACCESS_SECRET}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - smartdocflow-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://minio:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - smartdocflow-net
    entrypoint: >
      /bin/sh -c "
        echo 'Configuring MinIO client...' &&
        mc alias set local http://minio:9000 ${MINIO_ACCESS_NAME} ${MINIO_ACCESS_SECRET} &&
        echo 'Creating bucket ${MINIO_BUCKET_NAME} if not exists...' &&
        mc mb --ignore-existing local/${MINIO_BUCKET_NAME} &&
        echo 'Bucket ensured';
      "
    restart: "no"
  qdrant:
    container_name: smartdocflow-qdrant
    image: qdrant/qdrant:latest
    env_file:
      - .env
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smartdocflow-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://qdrant:6333/collections" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: smartdocflow-rabbitmq
    image: rabbitmq:3-management-alpine
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_MQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_MQ_PASS}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - smartdocflow-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  smartdocflow-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  qdrant_data: